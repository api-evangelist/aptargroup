description: >-
  AptarGroup is a global supplier of consumer-product dispensing, sealing, and active packaging
  solutions serving the beauty, personal care, home care, food, beverage, pharmaceutical and other
  markets. Its Aptar Pharma segment includes Aptar Digital Health, a software division building
  companion apps, connected drug-delivery devices and disease-management platforms, but Aptar
  publishes no public developer program, API reference or machine-readable contract for any of it.
