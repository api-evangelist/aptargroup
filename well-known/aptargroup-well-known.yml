specification: API Evangelist Well-Known Probe
specificationVersion: '0.1'
provider: AptarGroup
providerId: aptargroup
generated: '2026-09-04'
method: probed
source: >-
  Live unauthenticated HTTPS probes (browser User-Agent, redirects followed) of every host this
  record knows: the corporate site aptar.com/www.aptar.com, the Aptar Digital Health division site
  aptardigitalhealth.com, and the two hosts named by the repo's existing OpenAPI
  (www.aptargroup.com, api.aptargroup.com).
result: >-
  No well-known document is served on any AptarGroup host. www.aptargroup.com and api.aptargroup.com
  do not resolve (NXDOMAIN). aptar.com and www.aptar.com sit behind an Imperva/Incapsula bot wall
  that answers EVERY path — including /robots.txt — with a ~960-byte HTML interstitial and HTTP 200;
  those 200s are challenge shells, not documents, and are recorded as misses. aptardigitalhealth.com
  is fully readable (robots.txt allows all) and returns a real WordPress 404 for every probed path.
  No WellKnown or SecurityTxt pointer is emitted, because nothing was served.
notes: >-
  A 200 on aptar.com is not evidence of a document. Read the body: the Imperva shell is identifiable
  by <html style="height:100%"> plus a /_Incapsula_Resource iframe. Re-probe if Aptar ever relaxes
  the edge policy for non-browser clients.
