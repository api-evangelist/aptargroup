naftiko: "1.0.0-alpha1"

info:
  label: AptarGroup Packaging Sourcing
  description: >-
    Workflow capability for sourcing dispensing and packaging solutions from
    AptarGroup. Supports product development teams browsing sustainable packaging
    options and requesting samples for beauty, pharmaceutical, and food products.
  tags:
    - AptarGroup
    - Packaging
    - Product Development
    - Sustainability
    - Manufacturing
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      APTAR_API_TOKEN: APTAR_API_TOKEN

capability:
  consumes:
    - import: aptar
      location: ./shared/aptargroup-api.yaml

  exposes:
    - type: mcp
      port: 9090
      namespace: packaging-sourcing-mcp
      transport: http
      description: MCP server for AI-assisted packaging sourcing from AptarGroup.
      tools:
        - name: find-sustainable-packaging
          description: Finds sustainable dispensing and packaging solutions from AptarGroup
          hints:
            readOnly: true
            idempotent: true
          call: "aptar.list-products"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-packaging-specs
          description: Gets detailed specifications for a specific AptarGroup packaging product
          hints:
            readOnly: true
            idempotent: true
          call: "aptar.get-product"
          with:
            productId: "tools.productId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: order-packaging-samples
          description: Submits a sample request for AptarGroup packaging evaluation
          hints:
            readOnly: false
            destructive: false
          call: "aptar.create-sample-request"
          with:
            productId: "tools.productId"
            quantity: "tools.quantity"
            contactEmail: "tools.contactEmail"
          outputParameters:
            - type: object
              mapping: "$."
