naftiko: 1.0.0-alpha2
info:
  label: AptarGroup Packaging Sourcing
  description: Workflow capability for sourcing dispensing and packaging solutions from AptarGroup. Supports product development
    teams browsing sustainable packaging options and requesting samples for beauty, pharmaceutical, and food products.
  tags:
  - AptarGroup
  - Packaging
  - Product Development
  - Sustainability
  - Manufacturing
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    APTAR_API_TOKEN: APTAR_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: aptar
    baseUri: https://api.aptargroup.com/v1
    description: AptarGroup product catalog API
    authentication:
      type: bearer
      token: '{{APTAR_API_TOKEN}}'
    resources:
    - name: products
      path: /products
      description: Dispensing and packaging product catalog
      operations:
      - name: list-products
        method: GET
        description: Returns a list of products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-product
        method: GET
        description: Returns a specific product
        inputParameters:
        - name: productId
          in: path
          type: string
          required: true
          description: Product identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: orders
      path: /orders
      description: Sample request management
      operations:
      - name: create-sample-request
        method: POST
        description: Creates a product sample request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            productId: '{{tools.productId}}'
            quantity: '{{tools.quantity}}'
            contactEmail: '{{tools.contactEmail}}'
  exposes:
  - type: mcp
    port: 9090
    namespace: packaging-sourcing-mcp
    transport: http
    description: MCP server for AI-assisted packaging sourcing from AptarGroup.
    tools:
    - name: find-sustainable-packaging
      description: Finds sustainable dispensing and packaging solutions from AptarGroup
      hints:
        readOnly: true
        idempotent: true
      call: aptar.list-products
      outputParameters:
      - type: object
        mapping: $.
    - name: get-packaging-specs
      description: Gets detailed specifications for a specific AptarGroup packaging product
      hints:
        readOnly: true
        idempotent: true
      call: aptar.get-product
      with:
        productId: tools.productId
      outputParameters:
      - type: object
        mapping: $.
    - name: order-packaging-samples
      description: Submits a sample request for AptarGroup packaging evaluation
      hints:
        readOnly: false
        destructive: false
      call: aptar.create-sample-request
      with:
        productId: tools.productId
        quantity: tools.quantity
        contactEmail: tools.contactEmail
      outputParameters:
      - type: object
        mapping: $.
